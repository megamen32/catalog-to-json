[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-to-json"
version = "1.4.28"
description = "PDF catalogs to reviewed JSON with AnyDoc and FastAgent Vision"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fast-agent-mcp==0.10.43", "mcp==2.3.0", "firecrawl-anydoc==0.2.4", "pymupdf>=1.28,<2", "openpyxl>=3.1,<4", "psutil>=7,<8"]

[project.scripts]
catalog-json = "catalog_json.cli:main"
catalog-json-mcp = "catalog_json.tools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "catalog_json/skills"

[dependency-groups]
dev = ["pytest>=8,<10"]
